<!DOCTYPE html>
<html>
<head>
    <title>Event System - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <div class="logo">Event System</div>
        <div class="user-info">
            <span>Welcome, <strong id="currentUser"></strong></span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="main-content">
        <div class="card">
            <h2>Actions</h2>
            
            <div class="form-group">
                <div style="flex: 1;">
                    <label>Item Name</label>
                    <input type="text" id="item" placeholder="Enter item name">
                </div>
                <button class="btn" onclick="purchase()">Purchase</button>
            </div>

            <div class="form-group">
                <div style="flex: 1;">
                    <label>New Username</label>
                    <input type="text" id="newName" placeholder="Enter new username">
                </div>
                <button class="btn" onclick="updateProfile()">Update Profile</button>
            </div>

            <div class="form-group">
                <button class="btn btn-single" onclick="showSummary()">Show Summary</button>
            </div>
        </div>

        <div class="card">
            <div class="output-section">
                <h3>Activity Log</h3>
                <div id="output"></div>
            </div>
        </div>
    </div>

    <script src="eventadv.js"></script>
</body>
</html>
