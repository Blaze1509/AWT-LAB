<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Student</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; }
    .card { border-radius: 12px; }
  </style>
</head>
<body>
<div class="container py-5" style="max-width:600px">
  <div class="card shadow p-4">
    <h3 class="text-center mb-4">✏ Edit Student</h3>

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" name="name" class="form-control" value="{{ student.name }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Roll No</label>
        <input type="text" name="roll_no" class="form-control" value="{{ student.roll_no }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Department</label>
        <input type="text" name="department" class="form-control" value="{{ student.department }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Marks</label>
        <input type="number" name="marks" class="form-control" value="{{ student.marks }}" min="0" max="100" required>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success flex-fill">Save Changes</button>
        <a href="/" class="btn btn-secondary flex-fill">Cancel</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
